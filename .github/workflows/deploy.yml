name: Verify and deploy Soundroom

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soundroom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run check
      - run: npm run build
      - run: npm run build:api
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix functions --omit=dev --audit-level=high
      - name: Report cloud setup status
        if: vars.FIREBASE_READY != 'true'
        run: echo 'Cloud deployment is pending Firebase billing and OIDC setup. Tests run normally; no website or backend is published.' >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: verify
    if: github.event_name != 'pull_request' && vars.FIREBASE_READY == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
      FIREBASE_RUNTIME_SERVICE_ACCOUNT: ${{ vars.FIREBASE_RUNTIME_SERVICE_ACCOUNT }}
      APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      VITE_BASE_PATH: ${{ github.ref == 'refs/heads/main' && '/myactualnewapp/' || '/' }}
      ALLOWED_ORIGINS: ${{ github.ref == 'refs/heads/main' && 'https://nicholasfmathison.github.io' || format('https://{0}.web.app,http://localhost:5173,http://127.0.0.1:5173', vars.FIREBASE_PROJECT_ID) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Enforce local-only spending policy
        run: node scripts/check-cloud-approval.mjs
      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Write public app configuration and backend environment
        run: node scripts/configure-deployment.mjs
      - run: npm run build
      - name: Deploy rules, indexes, and API
        run: npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only firestore,storage,functions --non-interactive
      - name: Verify deployed API commit and access protection
        run: node scripts/smoke-deployment.mjs
      - name: Publish dev preview
        if: github.ref == 'refs/heads/dev'
        run: npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive
      - name: Upload production frontend
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages:
    needs: backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
